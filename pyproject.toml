[project]
name = "chess-ai-lab"
version = "0.1.0"
description = "A reproducible research platform for controlled game-playing experiments."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "python-chess>=1.999",
]

[project.scripts]
chesslab-benchmark = "chesslab.benchmark:main"
chesslab-uci = "chesslab.uci:main"

[dependency-groups]
dev = [
    "mypy>=1.17.1",
    "pytest>=8.4.1",
    "pytest-cov>=6.2.1",
    "ruff>=0.12.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chesslab"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
